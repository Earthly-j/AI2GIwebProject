<!DOCTYPE html><html><head><style>
body{margin:0}
/* simulate the :hover state so the dropdown is visible in a screenshot */
.main-nav__item:nth-child(3):hover .main-nav__submenu{display:block}
</style></head><body>
<iframe id="f" src="../종합현황/dashboard.html" style="width:1440px;height:420px;border:0" scrolling="no"></iframe>
<script>
document.getElementById('f').onload=function(){
  const d=this.contentDocument;
  // force item 3 (구매대행) submenu visible
  const subs=d.querySelectorAll('.main-nav__submenu');
  if(subs[2]) subs[2].style.display='block';
  // also add a highlight so we can see which one
  const items=d.querySelectorAll('.main-nav__item');
  if(items[2]) items[2].style.background='#107a77';
};
</script></body></html>
